name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_GENERATOR: Ninja

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: clang-format-18 --dry-run --Werror include/logstat/*.hpp src/*.cpp tests/*.cpp bench/*.cpp fuzz/*.cpp

  build:
    name: ${{ matrix.compiler }} / ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        config: [debug-asan-ubsan, release]
        include:
          - config: debug-asan-ubsan
            build_type: Debug
            sanitize: "address;undefined"
          - config: release
            build_type: Release
            sanitize: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build clang-18 libclang-rt-18-dev
      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then export CXX=clang++-18; else export CXX=g++; fi
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DLOGSTAT_WARNINGS_AS_ERRORS=ON \
                "-DLOGSTAT_SANITIZE=${{ matrix.sanitize }}"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure -j "$(nproc)"

  tsan:
    name: gcc / thread sanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLOGSTAT_SANITIZE=thread -DLOGSTAT_BUILD_BENCH=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build clang-18 clang-tidy-18
      - run: CXX=clang++-18 cmake -B build -DLOGSTAT_BUILD_TESTS=OFF
      - run: clang-tidy-18 -p build src/*.cpp bench/bench.cpp

  fuzz:
    name: libFuzzer (60 s)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build clang-18 libclang-rt-18-dev
      - run: CXX=clang++-18 cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLOGSTAT_BUILD_FUZZ=ON -DLOGSTAT_BUILD_TESTS=OFF -DLOGSTAT_BUILD_BENCH=OFF
      - run: cmake --build build --target fuzz_parser
      - run: |
          mkdir -p corpus && cp fuzz/corpus/* corpus/
          ./build/fuzz_parser -max_total_time=60 -max_len=4096 corpus
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crash
          path: crash-*

  bench:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DLOGSTAT_BUILD_TESTS=OFF
      - run: cmake --build build
      - name: Benchmark
        run: |
          {
            echo '### logstat benchmark'
            echo '```'
            ./build/logstat_bench 2000000
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: logstat:ci
      - name: Smoke test
        run: |
          docker run --rm logstat:ci --version
          docker run --rm -i logstat:ci --format json < examples/access.log | python3 -m json.tool > /dev/null
